<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
<title id="title">Multi-server composition</title>
<desc id="description">Content from server A can influence an agent to propose a tool call to server B, which has different capabilities and credentials. This is a possible attack path, not an inevitable outcome: host policy and server authorization can restrict it.</desc>
<defs>
<marker id="arrow-purple" viewBox="0 0 12 12" markerWidth="10" markerHeight="10" refX="10" refY="6" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11Z" fill="#AE85FF"/></marker>
<marker id="arrow-green" viewBox="0 0 12 12" markerWidth="10" markerHeight="10" refX="10" refY="6" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11Z" fill="#5FED83"/></marker>
<marker id="arrow-orange" viewBox="0 0 12 12" markerWidth="10" markerHeight="10" refX="10" refY="6" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11Z" fill="#FFABA8"/></marker>
</defs>
<rect width="1600" height="800" fill="#101411"/>
<text x="80" y="94" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="600" text-anchor="start">Multi-server composition</text>
<line x1="80" y1="129" x2="1520" y2="129" stroke="#B0BAC2" stroke-width="2" stroke-opacity="0.35"/>
<rect x="100" y="280" width="350" height="150" rx="10" fill="#101411" stroke="#5FED83" stroke-width="2.5"/>
<text x="275.0" y="369.96" fill="#5FED83" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="600" text-anchor="middle">Server A</text>
<rect x="650" y="280" width="300" height="150" rx="10" fill="#101411" stroke="#AE85FF" stroke-width="2.5"/>
<text x="800.0" y="369.96" fill="#AE85FF" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="600" text-anchor="middle">Agent</text>
<rect x="1160" y="280" width="350" height="150" rx="10" fill="#101411" stroke="#5FED83" stroke-width="2.5"/>
<text x="1335.0" y="369.96" fill="#5FED83" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="600" text-anchor="middle">Server B</text>
<path d="M455 355 H642" fill="none" stroke="#5FED83" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M955 355 H1152" fill="none" stroke="#FFABA8" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-orange)" stroke-dasharray="10 8"/>
<text x="550" y="243" fill="#5FED83" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="middle">Content</text>
<text x="1055" y="243" fill="#FFABA8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="middle">Tool call</text>
<text x="275" y="492" fill="#B0BAC2" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="middle">Issue text</text>
<text x="800" y="492" fill="#B0BAC2" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="middle">Host + model</text>
<text x="1335" y="492" fill="#B0BAC2" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="middle">Messaging tool</text>
<text x="800" y="630" fill="#FFABA8" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" text-anchor="middle">Content from A can influence a call to B.</text>
<line x1="80" y1="716" x2="296" y2="716" stroke="#B0BAC2" stroke-width="1" stroke-opacity="0.35"/>
<text x="80" y="760" fill="#B0BAC2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">1  Discovery</text>
<line x1="320" y1="716" x2="536" y2="716" stroke="#B0BAC2" stroke-width="1" stroke-opacity="0.35"/>
<text x="320" y="760" fill="#B0BAC2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">2  Transport / auth</text>
<line x1="560" y1="716" x2="776" y2="716" stroke="#B0BAC2" stroke-width="1" stroke-opacity="0.35"/>
<text x="560" y="760" fill="#B0BAC2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">3  Servers</text>
<line x1="800" y1="716" x2="1016" y2="716" stroke="#B0BAC2" stroke-width="1" stroke-opacity="0.35"/>
<text x="800" y="760" fill="#B0BAC2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">4  Context flow</text>
<line x1="1040" y1="716" x2="1256" y2="716" stroke="#B0BAC2" stroke-width="1" stroke-opacity="0.35"/>
<text x="1040" y="760" fill="#B0BAC2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">5  Host / client</text>
<line x1="1280" y1="716" x2="1496" y2="716" stroke="#5FED83" stroke-width="4"/>
<text x="1280" y="760" fill="#5FED83" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="start">6  Multi-server</text>
</svg>
