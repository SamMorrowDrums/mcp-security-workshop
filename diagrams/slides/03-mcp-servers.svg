<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
<title id="title">MCP servers</title>
<desc id="description">Local and remote servers execute code with access to other resources. A local server can reach files and processes; a remote server can reach APIs, databases, and SaaS. These are examples rather than exclusive capabilities.</desc>
