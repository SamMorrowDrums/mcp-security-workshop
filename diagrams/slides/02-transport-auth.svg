<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
<title id="title">Transport &amp; auth</title>
<desc id="description">Two alternatives: a host communicates with a local server process over stdio, or with a remote server over HTTP. Local process permissions and credential handling differ from remote endpoint and token authorization. These lanes are alternatives, not sequential stages.</desc>
<defs>
<marker id="arrow-purple" viewBox="0 0 12 12" markerWidth="10" markerHeight="10" refX="10" refY="6" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11Z" fill="#AE85FF"/></marker>
<marker id="arrow-green" viewBox="0 0 12 12" markerWidth="10" markerHeight="10" refX="10" refY="6" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11Z" fill="#5FED83"/></marker>
<marker id="arrow-orange" viewBox="0 0 12 12" markerWidth="10" markerHeight="10" refX="10" refY="6" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11Z" fill="#FFABA8"/></marker>
</defs>
<rect width="1600" height="800" fill="#101411"/>
<text x="80" y="94" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="600" text-anchor="start">Transport &amp; auth</text>
<line x1="80" y1="129" x2="1520" y2="129" stroke="#B0BAC2" stroke-width="2" stroke-opacity="0.35"/>
<text x="100" y="200" fill="#AE85FF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" text-anchor="start">LOCAL</text>
<rect x="100" y="235" width="390" height="105" rx="10" fill="#101411" stroke="#AE85FF" stroke-width="2.5"/>
<text x="295.0" y="300.42" fill="#AE85FF" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" text-anchor="middle">Host / client</text>
<rect x="1100" y="235" width="400" height="105" rx="10" fill="#101411" stroke="#5FED83" stroke-width="2.5"/>
<text x="1300.0" y="300.42" fill="#5FED83" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" text-anchor="middle">Local process</text>
<path d="M495 287.5 H1093" fill="none" stroke="#AE85FF" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)"/>
<text x="800" y="263" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="middle">stdio</text>
<text x="800" y="390" fill="#B0BAC2" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="middle">OS identity / process permissions / credentials</text>
<line x1="100" y1="425" x2="1500" y2="425" stroke="#B0BAC2" stroke-width="1" stroke-opacity="0.35"/>
<text x="100" y="475" fill="#AE85FF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" text-anchor="start">REMOTE</text>
<rect x="100" y="510" width="390" height="105" rx="10" fill="#101411" stroke="#AE85FF" stroke-width="2.5"/>
<text x="295.0" y="575.42" fill="#AE85FF" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" text-anchor="middle">Host / client</text>
<rect x="1100" y="510" width="400" height="105" rx="10" fill="#101411" stroke="#5FED83" stroke-width="2.5"/>
<text x="1300.0" y="575.42" fill="#5FED83" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" text-anchor="middle">Remote server</text>
<path d="M495 562.5 H1093" fill="none" stroke="#AE85FF" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)"/>
<text x="800" y="538" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400" text-anchor="middle">HTTP</text>
<text x="800" y="665" fill="#B0BAC2" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="middle">Endpoint / tokens / scopes</text>
