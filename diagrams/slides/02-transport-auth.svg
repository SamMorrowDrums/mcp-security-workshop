<line x1="1040" y1="716" x2="1256" y2="716" stroke="#B0BAC2" stroke-width="1" stroke-opacity="0.35"/>
<text x="1040" y="760" fill="#B0BAC2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">5  Host / client</text>
