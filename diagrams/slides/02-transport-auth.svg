<text x="80" y="760" fill="#B0BAC2" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">1  Discovery</text>
<line x1="320" y1="716" x2="536" y2="716" stroke="#5FED83" stroke-width="4"/>
<text x="320" y="760" fill="#5FED83" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="start">2  Transport / auth</text>
