<text x="995.0" y="437.31" fill="#AE85FF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle">Tool-use</text>
<text x="995.0" y="479.81" fill="#AE85FF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle">policy</text>
