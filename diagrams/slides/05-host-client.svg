<text x="300.0" y="458.56" fill="#AE85FF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle">MCP clients</text>
<rect x="510" y="385" width="280" height="124" rx="10" fill="#101411" stroke="#AE85FF" stroke-width="2.5"/>
<text x="650.0" y="437.31" fill="#AE85FF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle">Context</text>
