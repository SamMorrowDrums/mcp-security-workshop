<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
<title id="title">MCP Security Surface</title>
<desc id="description">Six areas from the original chart, simplified for projection: discovery and supply chain; transport and authorization; servers; context flow; host and client; multi-server composition. Rows are concerns, not nested software components.</desc>
<defs>
<marker id="arrow-purple" viewBox="0 0 12 12" markerWidth="10" markerHeight="10" refX="10" refY="6" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11Z" fill="#AE85FF"/></marker>
